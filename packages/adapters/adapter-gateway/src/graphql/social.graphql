scalar DateTime

input PostFilter {
  spaceId: ID
  hashtag: String
  authorId: ID
  limit: Int
  offset: Int
  [key: String]: any
}

input CreatePostInput {
  userId: ID!
  content: String!
  spaceId: ID
  hashtags: [String!]
  isPoll: Boolean
  pollOptions: [String!]
  pollExpiresInSeconds: Int
  isMemory: Boolean
  memoryDate: String
  isRadio: Boolean
  radioGenre: String
  federationProtocol: FederationProtocol
  federationVisibility: FederationVisibility
}

input UpdatePostInput {
  content: String
  hashtags: [String!]
  pollOptions: [String!]
}

input CreateCommentInput {
  content: String!
  authorId: ID
}

input CreateSpaceInput {
  name: String!
  slug: String
  description: String
}

input StartLiveInput {
  title: String
}

enum FederationProtocol {
  ACTIVITYPUB
  ATPROTO
}

enum FederationVisibility {
  PUBLIC
  UNLISTED
  PRIVATE
  DIRECT
  FOLLOWERS
  LISTS
}

type Post {
  id: ID!
  authorId: ID!
  content: String!
  createdAt: DateTime!
  updatedAt: DateTime
  spaceId: ID
  hashtags: [String!]
  isPoll: Boolean
  pollOptions: [PollOption!]
  isMemory: Boolean
  memoryDate: String
  isRadio: Boolean
  radioGenre: String
}

type PollOption {
  id: ID!
  text: String!
  voteCount: Int!
}

type Comment {
  id: ID!
  postId: ID!
  authorId: ID!
  content: String!
  createdAt: DateTime!
  parentId: ID
  replies: [Comment!]
}

type Space {
  id: ID!
  name: String!
  slug: String
  description: String
  memberCount: Int
  createdAt: DateTime
}

type Vibe {
  id: ID!
  url: String!
  authorId: ID
  createdAt: DateTime
}

type LiveStream {
  id: ID!
  title: String
  viewerCount: Int
  isLive: Boolean!
}

type Notification {
  id: ID!
  type: NotificationType!
  actorId: ID!
  targetId: ID
  read: Boolean!
  createdAt: DateTime!
}

enum NotificationType {
  LIKE
  REPOST
  COMMENT
  FOLLOW
  MENTION
}

type UserProfile {
  id: ID!
  name: String
  username: String
  avatar: String
}

type MutationResult {
  success: Boolean!
}

type Query {
  posts(filter: PostFilter): [Post!]!
  post(id: ID!): Post
  comments(postId: ID!, limit: Int, offset: Int): [Comment!]!
  thread(commentId: ID!): Comment
  feed(type: String!, filter: PostFilter): [Post!]!
  userFeed(userId: ID!, filter: PostFilter): [Post!]!
  notifications(limit: Int, offset: Int, unreadOnly: Boolean): [Notification!]!
  spaces(limit: Int, query: String): [Space!]!
  space(id: ID!): Space
  vibez(limit: Int): [Vibe!]!
  vibe(vibeId: ID!): Vibe
  live(liveId: ID!): LiveStream
  liveViewers(liveId: ID!): LiveViewerCount
  user(userId: ID!): UserProfile
  searchUsers(query: String!): [UserProfile!]!
  reposts(postId: ID!, filter: PostFilter): [Post!]!
  isReposted(postId: ID!): RepostStatus
  followers(userId: ID!, limit: Int): [UserProfile!]!
  following(userId: ID!, limit: Int): [UserProfile!]!
  members(spaceId: ID!, limit: Int): [UserProfile!]!
  spacePosts(spaceId: ID!, filter: PostFilter): [Post!]!
}

type Mutation {
  createPost(input: CreatePostInput!): Post!
  updatePost(id: ID!, input: UpdatePostInput!): Post!
  deletePost(id: ID!): MutationResult!
  repost(postId: ID!): MutationResult!
  unrepost(postId: ID!): MutationResult!
  mutePost(postId: ID!): MutationResult!
  blockPost(postId: ID!): MutationResult!
  createComment(postId: ID!, input: CreateCommentInput!): Comment!
  replyToComment(commentId: ID!, input: CreateCommentInput!): Comment!
  deleteComment(commentId: ID!): MutationResult!
  reactToComment(commentId: ID!, reaction: String!): MutationResult!
  reportComment(commentId: ID!, reason: String!): MutationResult!
  markNotificationRead(notificationId: ID!): MutationResult!
  createSpace(input: CreateSpaceInput!): Space!
  joinSpace(spaceId: ID!): MutationResult!
  leaveSpace(spaceId: ID!): MutationResult!
  likeVibe(vibeId: ID!): MutationResult!
  startLive(input: StartLiveInput): LiveStream!
  stopLive(liveId: ID!): MutationResult!
  follow(userId: ID!): MutationResult!
  unfollow(userId: ID!): MutationResult!
}

type LiveViewerCount {
  count: Int!
}

type RepostStatus {
  reposted: Boolean!
}