scalar DateTime

input ProductFilter {
  search?: String
  categoryId?: ID
  pageSize?: Int
  currentPage?: Int
}

input AddToCartInput {
  cartId?: ID
  productId: ID!
  quantity: Int!
}

input UpdateCartInput {
  cartId: ID!
  itemId: ID!
  quantity: Int!
}

input CheckoutInput {
  cartId: ID!
  email: String!
  shippingAddress?: AddressInput
  billingAddress?: AddressInput
}

input AddressInput {
  firstName: String!
  lastName: String!
  street: String!
  city: String!
  state: String
  postalCode: String!
  country: String!
}

type Money {
  value: Float!
  currencyCode: String!
}

type Price {
  regular: Money!
  current: Money
}

type Product {
  id: ID!
  name: String
  title: String
  slug: String
  description: String
  price: Float!
  image: String
  images: [String!]
}

type Category {
  id: ID!
  name: String!
  slug: String
  description: String
}

type Brand {
  id: ID!
  name: String!
  slug: String
  description: String
}

type PriceRule {
  id: ID!
  name: String!
  conditions: JSON
  actions: JSON
}

type CartItem {
  id: ID!
  productId: ID!
  variantId: ID
  quantity: Int!
  price: Price!
}

type Cart {
  id: ID!
  items: [CartItem!]!
  totalPrice: Price!
}

type Checkout {
  id: ID!
  status: String!
  totalPrice: Price!
  items: [CartItem!]!
}

type Query {
  product(id: ID!): Product
  products(filter: ProductFilter): [Product!]!
  categories: [Category!]!
  category(id: ID!): Category
  brands: [Brand!]!
  brand(id: ID!): Brand
  search(query: String!, limit: Int, offset: Int): [Product!]!
  price(productId: ID!): Price
  priceRules: [PriceRule!]!
  cart(cartId: ID): Cart
  checkout(checkoutId: ID!): Checkout
  suggestions(query: String!, limit: Int): [Product!]!
  cartPriceRules(cartId: ID): [PriceRule!]!
}

type Mutation {
  addToCart(input: AddToCartInput!): Cart
  updateCart(input: UpdateCartInput!): Cart
  removeFromCart(itemId: ID!): Cart
  clearCart(cartId: ID!): MutationResult
  createCheckout(input: CheckoutInput!): Checkout
  updateCheckout(checkoutId: ID!, input: CheckoutInput!): Checkout
  completeCheckout(checkoutId: ID!): MutationResult
}

type MutationResult {
  success: Boolean!
}